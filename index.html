<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DCS Cockpit Trainer</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#080c0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit Trainer">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="src/core/style.css">
</head>
<body>

<div id="top">
  <div id="brand"><b data-brand>F-14B</b><span>Cockpit Trainer</span></div>
  <div class="tabs" id="tabs"></div>
  <div id="topright">
    <button class="chip" id="timechip" title="Time compression">1×</button>
    <button class="chip" id="dirchip" title="Which way a tap moves a switch">Tap ▲</button>
    <button class="chip" id="labelchip">Labels</button>
    <button class="chip on" id="modechip">Guided</button>
  </div>
</div>

<div id="main">
  <div id="stage">
    <div id="viewport"><div id="world"><div id="overlay"></div></div></div>
    <div id="toast"></div>
    <div id="comms"><h3>Radio · <span id="commsTitle">Menu</span></h3><div id="commsBody"></div></div>
    <div id="zoompad">
      <button id="zin" title="Zoom in">+</button>
      <button id="zout" title="Zoom out">−</button>
      <button id="zfit" title="Fit" style="font-size:10px">FIT</button>
    </div>
    <div id="editbar">
      <span>Calibrate</span>
      <button class="btn sm" id="edCopy">Copy layout JSON</button>
      <button class="btn sm" id="edDone">Done</button>
    </div>

    <div id="done" class="gone">
      <div class="card">
        <div class="kick">Procedure complete</div>
        <h1 id="doneTitle">Ready to Taxi<small id="doneSub"></small></h1>
        <dl id="doneStats"></dl>
        <div class="gaterow">
          <button class="btn pri" id="doneAgain">Run it again</button>
          <button class="btn" id="doneStay">Stay in the cockpit</button>
        </div>
      </div>
    </div>

  </div>

  <div id="rail">
    <button id="railgrab" aria-label="Close the checklist">
      <span class="grabpill"></span>
      <span class="grabtext">Close</span>
    </button>
    <div class="railhead">
      <div class="eyebrow">Kneeboard</div>
      <h2 id="phaseName">—</h2>
      <div id="progwrap"><div id="prog"></div></div>
    </div>
    <div id="board"></div>
    <div id="railfoot">
      <button class="btn pri" id="btnHint">Show me (H)</button>
      <button class="btn" id="btnSkip">Skip step</button>
      <button class="btn" id="btnReset">Restart</button>
      <button class="btn" id="btnScramble" title="Reset, then mis-set switches you are meant to check">Scramble</button>
      <button class="btn" id="btnMenu">Menu</button>
      <button class="btn" id="btnKnee">Kneeboard</button>
      <button class="btn deskonly" id="btnEdit">Calibrate</button>
    </div>
  </div>
</div>

<div id="stepbar">
  <button id="stepbarOpen">
    <span id="stepbarN"></span>
    <span id="stepbarT">—</span>
  </button>
  <button id="stepbarShow">Show me</button>
  <button id="stepbarC" aria-label="Open the checklist">▲</button>
</div>

<div id="strip"></div>

<script type="module" src="src/core/app.js"></script>
</body>
</html>
